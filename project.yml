name: PsiMobile
options:
  bundleIdPrefix: am.local
  deploymentTarget:
    iOS: "17.0"
packages:
  XMPPFramework:
    url: https://github.com/robbiehanson/XMPPFramework
    revision: 7d4dd1f215f18e9db5bbf1739403583c78afb4e7
  # Подменяет одноимённую зависимость XMPPFramework: без кода GNU libidn (LGPL).
  libidn-framework:
    path: Packages/libidn-framework
targets:
  PsiMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        optional: true
    dependencies:
      - package: XMPPFramework
      - framework: Frameworks/Psipgp.xcframework
        embed: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Psi Mobile
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: am.local.psimobile
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          STRIP_SWIFT_SYMBOLS: YES
